name: Merge check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend install and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install with the lockfile
        run: pnpm install --frozen-lockfile

      # convex/security.test.ts imports gitignored convex/_generated.
      # Library tests and the auth check do not, so they are the merge signal.
      - name: Test library code
        run: pnpm exec vitest run convex/lib

      - name: Convex auth check
        run: node scripts/convex-auth-check.mjs
